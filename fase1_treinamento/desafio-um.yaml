name: Desafio Um

on:
  workflow_dispatch:
    inputs:

      image_name:
        description: 'Nome da imagem'
        required: false
        default: 'alpine:latest'
        type: string


jobs:
  desafio:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}        

      - name: Download da imagem recebida como parametro
        run: |
          docker pull ${{ github.event.inputs.image_name }}

      - name: Verificar imagem
        run: |
          IMAGE_NAME=$(echo "${{ github.event.inputs.image_name }}" | cut -d ':' -f 1)
          docker images | grep $IMAGE_NAME

      - name: Análise de vulneravilidades
        uses: docker/scout-action@v1
        with:
          command: quickview,recommendations,sbom
          image: ${{ github.event.inputs.image_name }}
          only-severities: critical, high
          summary: true
