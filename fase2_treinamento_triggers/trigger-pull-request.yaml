name: Trigger de Pull Request

on:
  pull_request:/
    types: [opened, edited, deleted, reopened]
    branches:
      - 'main'
      - 'main/**'

jobs:
  trigger-pull-request:
    runs-on: ubuntu-latest
    steps:
      - name: Pull Request
        run:  echo "Pull Request foi aberto/editado/excluido/reaberto tendo como destino a branch main"