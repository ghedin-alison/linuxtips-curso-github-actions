name: Primeiro workflow linuxtips

on:
  push:
    branches:
      - main

jobs:
  giropops:
    runs-on: ubuntu-latest
    steps:
      - name: Confere Versão do ubuntu
        run: cat /etc/os-release
      - name: Exibir Mensagem
        run: echo "Meu primeiro workflow com github actions!!!" > mensagem.txt
      - name: Exibir arquivo
        run: ls -lha
      - name: Listar arquivo mensagem.txt
        run: cat mensagem.txt
