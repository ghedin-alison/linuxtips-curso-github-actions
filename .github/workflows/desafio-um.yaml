name: Desafio Um

on:
  workflow_dispatch:
    inputs:

      image_name:
        description: 'Nome da imagem'
        required: true
        type: string

      image_tag:
        description: 'Tag da imagem'
        required: true
        type: string

jobs:
  desafio:
    runs-on: ubuntu-latest

    env:
      INPUT_IMAGE_NAME: ${{ inputs.image_name }}
      INPUT_IMAGE_TAG: ${{ inputs.image_tag }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}        

      - name: Download da imagem recebida como parametro
        run: docker pull ${{ env.INPUT_IMAGE_NAME }}:${{ env.INPUT_IMAGE_TAG }}

      - name: Verificar imagem
        run: docker images

      - name: Análise de vulneravilidades
        uses: docker/scout-action@v1
        with:
          command: quickview,cves,recommendation,sbom
          image: ${{ env.INPUT_IMAGE_NAME }}:${{ env.INPUT_IMAGE_TAG }}
          only-severities: critical, high
          summary: true
