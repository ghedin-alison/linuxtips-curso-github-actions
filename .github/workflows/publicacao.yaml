# o primeiro é disparado por um desenvolvedor
# chamar o segundo que realiza build e testes
# o terceiro deve ser automaticamente disparado se os testes forem executados com sucesso
name: Publicar

on:
  workflow_run:
    workflows: [Validacao de ambiente]
    types:
      - completed

jobs:
  comunica-termino-do-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Informa o término do workflow
        run: echo "O Workflow 'Validacao de ambiente' terminou de ser executado"